<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guardaroba</title>
  <meta name="description" content="Il guardaroba di famiglia: armadio in ordine, lavatrici al momento giusto, cosa mettersi in base al meteo.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Guardaroba">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <button data-a="tab" data-v="oggi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Oggi</span>
    </button>
    <button data-a="tab" data-v="armadio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5a2.2 2.2 0 1 1 2.2 2.2c-1 0-2.2.7-2.2 1.8v1"/><path d="M12 11.5 3.6 17.4c-.6.5-.3 1.6.5 1.6h15.8c.8 0 1.1-1.1.5-1.6z"/></svg>
      <span>Armadio</span>
    </button>
    <button data-a="tab" data-v="bucato">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="13" r="4.5"/><path d="M7.5 6.5h2"/></svg>
      <span>Bucato</span><i class="badge" id="washBadge" hidden></i>
    </button>
    <button data-a="tab" data-v="regole">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Regole</span>
    </button>
  </nav>

  <div id="sheet"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
