<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black rounded square -->
  <rect width="100" height="100" rx="22" fill="#000"/>

  <defs>
    <clipPath id="pClip">
      <ellipse cx="50" cy="46" rx="16" ry="17"/>
    </clipPath>
  </defs>

  <!-- Rice base (wider oval — the nigiri body) -->
  <ellipse cx="50" cy="79" rx="28" ry="11" fill="#fff"/>

  <!-- Pineapple body (narrower oval, sits above rice with a dark gap = nori) -->
  <ellipse cx="50" cy="46" rx="16" ry="17" fill="#fff"/>

  <!-- Pineapple crosshatch (diamond texture, clipped to body) -->
  <g clip-path="url(#pClip)" stroke="#000" stroke-width="2.2">
    <!-- / direction lines -->
    <line x1="10" y1="66" x2="46" y2="28"/>
    <line x1="18" y1="66" x2="54" y2="28"/>
    <line x1="26" y1="66" x2="62" y2="28"/>
    <line x1="34" y1="66" x2="70" y2="28"/>
    <line x1="42" y1="66" x2="78" y2="28"/>
    <!-- \ direction lines -->
    <line x1="90" y1="66" x2="54" y2="28"/>
    <line x1="82" y1="66" x2="46" y2="28"/>
    <line x1="74" y1="66" x2="38" y2="28"/>
    <line x1="66" y1="66" x2="30" y2="28"/>
    <line x1="58" y1="66" x2="22" y2="28"/>
  </g>

  <!-- Crown leaves (5 blades radiating from top of pineapple) -->
  <path d="M 50 30 C 50 19 50 10 50 4"   stroke="#fff" stroke-width="4"   stroke-linecap="round" fill="none"/>
  <path d="M 45 31 C 41 21 39 12 42 5"   stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 55 31 C 59 21 61 12 58 5"   stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 40 33 C 34 24 31 15 35 8"   stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 60 33 C 66 24 69 15 65 8"   stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
