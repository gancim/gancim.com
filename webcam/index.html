<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%B9</text></svg>">
<title>Webcam</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0b0d10;
    color: #e6e9ef;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* Video first, controls below — thumb-friendly on phones */
  .stage {
    flex: 1;
    position: relative;
    background: #000;
    min-height: 0;
  }
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
    object-fit: contain;
  }
  #msg {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #8a93a0; font-size: 15px; text-align: center; padding: 24px;
  }

  #title {
    padding: 10px 14px calc(6px + env(safe-area-inset-bottom, 0px));
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    border-top: 1px solid #1c2128;
  }
  #camjp { font-weight: 400; opacity: .55; font-size: 12px; }

  /* Horizontally scrollable button bar */
  .cams {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cams::-webkit-scrollbar { display: none; }
  button {
    flex: 0 0 auto;
    scroll-snap-align: start;
    background: #161a20;
    color: #cfd6e0;
    border: 1px solid #262d36;
    padding: 10px 16px;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.3;
    min-height: 48px;
    justify-content: center;
  }
  button .en { font-size: 14px; font-weight: 600; white-space: nowrap; }
  button .jp { font-size: 11px; opacity: .55; white-space: nowrap; }
  button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.active .jp { opacity: .85; }

  /* On wider screens put the bar on top and let it wrap */
  @media (min-width: 700px) {
    body { flex-direction: column; }
    .cams { flex-wrap: wrap; overflow-x: visible; order: -1; border-bottom: 1px solid #1c2128; }
    #title { border-top: 0; order: -2; }
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="video" playsinline autoplay muted controls></video>
    <div id="msg"></div>
  </div>

  <div id="title">📹 <span id="camname"></span> <span id="camjp"></span></div>

  <div class="cams" id="cams"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    // Reverse-engineered from namiaru.com -> videog.jp players.
    // Raw HLS stream feeds (no domain lock, no preroll ad).
    const CAMERAS = [
      { name: '湘南・由比ガ浜',     en: 'Shonan · Yuigahama',           src: 'https://cf-iplvc21004.videog.jp/live/_definst_/69PUNRGse8Wh.stream/playlist.m3u8' },
      { name: '湘南・江ノ島東浜',   en: 'Shonan · Enoshima East Beach', src: 'https://cf-iplvc21004.videog.jp/live/_definst_/zVFV1TcWNnGL.stream/playlist.m3u8' },
      { name: '湘南・江ノ島水族館', en: 'Shonan · Enoshima Aquarium',   src: 'https://cf-iplvc21004.videog.jp/live/_definst_/XVrK5KbyfB0T.stream/playlist.m3u8' },
      { name: '湘南・引地川河口',   en: 'Shonan · Hikiji River Mouth',  src: 'https://cf-iplvc21004.videog.jp/live/_definst_/-GrLD4br1o0d.stream/playlist.m3u8' },
      { name: '湘南・辻堂',         en: 'Shonan · Tsujido',             src: 'https://cf-iplvc21004.videog.jp/live/_definst_/w_3fsrQtTh9C.stream/playlist.m3u8' },
      { name: '伊豆・白浜',         en: 'Izu · Shirahama',              src: 'https://p13175-ipcam01.videog.jp/live/_definst_/l0Pypc9-4JQi.stream/playlist.m3u8' },
      { name: '和歌山・磯の浦',     en: 'Wakayama · Isonoura',          src: 'https://p2705-live01-dvr.videog.jp/live/_definst_/QxtagHlr03AB.stream/playlist.m3u8' },
    ];

    const video   = document.getElementById('video');
    const msg     = document.getElementById('msg');
    const camname = document.getElementById('camname');
    const camjp   = document.getElementById('camjp');
    const camsEl  = document.getElementById('cams');
    let hls = null;

    function teardown() {
      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src');
      video.load();
      msg.style.display = 'none';
    }

    function play(url) {
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / iOS native HLS
        video.src = url;
        video.play().catch(() => {});
      } else if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ liveSyncDurationCount: 3 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            msg.textContent = 'This camera may be offline right now.';
            msg.style.display = 'flex';
          }
        });
      } else {
        msg.textContent = 'HLS is not supported in this browser.';
        msg.style.display = 'flex';
      }
    }

    function select(i) {
      const cam = CAMERAS[i];
      teardown();
      camname.textContent = cam.en;
      camjp.textContent = cam.name;
      [...camsEl.children].forEach((b, j) => b.classList.toggle('active', j === i));
      location.hash = i;
      play(cam.src);
    }

    CAMERAS.forEach((cam, i) => {
      const b = document.createElement('button');
      b.innerHTML = `<span class="en">${cam.en}</span><span class="jp">${cam.name}</span>`;
      b.onclick = () => select(i);
      camsEl.appendChild(b);
    });

    const start = parseInt(location.hash.slice(1));
    select(CAMERAS[start] ? start : 0);
  </script>
</body>
</html>
